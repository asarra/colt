services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    user: "1002:1002"
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - /var/srv/vaultwarden:/data

  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    restart: always
    environment:
      - USER_UID=1003
      - USER_GID=1003
    volumes:
      - /var/srv/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:222:22'

  # AI stack
  open-webui:
   image: ghcr.io/open-webui/open-webui:main
   container_name: open-webui
   restart: unless-stopped
   ports:
     - "127.0.0.1:9119:8080"
   environment:
     - OLLAMA_BASE_URL: "http://ollama-ai:11434"
     - ENABLE_WEB_SEARCH: True
     - WEB_SEARCH_ENGINE: "searxng"
     - WEB_SEARCH_RESULT_COUNT: 3
     - WEB_SEARCH_CONCURRENT_REQUESTS: 0
     - SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
     # small models like gemma4 and qwen 3.5 do not support native function calling and fail to fetch website content without bypassing
     - BYPASS_WEB_SEARCH_WEB_LOADER: True
     - DEFAULT_MODEL_PARAMS: {"function_calling":"legacy"}
   volumes:
     - /var/srv/open-webui:/app/backend/data
   depends_on:
     - ollama-ai
  ollama-ai:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /var/srv/ollama:/root/.ollama
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ]; then
          secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "use_default_settings: true" > /etc/searxng/settings.yml
          echo "" >> /etc/searxng/settings.yml
          echo "server:" >> /etc/searxng/settings.yml
          echo "  secret_key: \"$$secret\"" >> /etc/searxng/settings.yml
          echo "search:" >> /etc/searxng/settings.yml
          echo "  formats:" >> /etc/searxng/settings.yml
          echo "    - html" >> /etc/searxng/settings.yml
          echo "    - json" >> /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/srv/searxng:/etc/searxng:z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  stirling-pdf:
    image: docker.io/stirlingtools/stirling-pdf:latest-fat
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - '127.0.0.1:8083:8080'
    volumes:
      - /var/srv/stirling-pdf:/configs
