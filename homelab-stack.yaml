services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    user: "1002:1002"
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - /var/srv/vaultwarden:/data

  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    restart: always
    environment:
      - USER_UID=1003
      - USER_GID=1003
    volumes:
      - /var/srv/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:222:22'

  # AI stack
  open-webui:
   image: ghcr.io/open-webui/open-webui:main
   container_name: open-webui
   restart: unless-stopped
   ports:
     - "127.0.0.1:9119:8080"
   environment:
     - OLLAMA_BASE_URL=http://ollama-ai:11434
   volumes:
     - /var/srv/open-webui:/app/backend/data
   depends_on:
     - ollama-ai
  ollama-ai:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /var/srv/ollama:/root/.ollama

  stirling-pdf:
    image: docker.io/stirlingtools/stirling-pdf:latest-fat
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - '127.0.0.1:8083:8080'
    volumes:
      - /var/srv/stirling-pdf:/configs
